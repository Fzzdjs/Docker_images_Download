name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          # One Windows leg is enough to catch path/encoding regressions.
          - os: windows-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile
        run: python -m compileall -q scripts tests

      - name: Install test-only dependency
        run: python -m pip install --quiet pyyaml

      - name: Run tests
        run: python -m unittest discover -s tests -v
