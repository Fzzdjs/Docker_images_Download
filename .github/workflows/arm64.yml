name: ARM64 Pull and Save Docker Image

on:
  workflow_dispatch:
    inputs:
      docker_images:
        description: 'Image names, comma or newline separated (platform: linux/arm64)'
        required: true
        default: 'alpine:latest,busybox:stable-glibc'
      retention_days:
        description: 'Artifact retention in days (1-90)'
        required: false
        default: '1'

# Artifact upload uses the built-in runner token; read-only is enough.
permissions:
  contents: read

# Fixed release tags and fixed artifact names mean two runs would collide.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  PLATFORM: linux/arm64
  ARCH: arm64

jobs:
  pull_and_package:
    # Defaults to a GitHub-hosted runner. To use your own machine (for example a
    # VPS with a faster route), add RUNNER_LABELS=["self-hosted","linux","x64"]
    # under Settings -> Secrets and variables -> Actions -> Variables.
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          docker system prune -a -f || true
          df -h /

      - name: Pull images and package
        env:
          DOCKER_IMAGES: ${{ inputs.docker_images }}
        run: |
          set -euo pipefail

          # Accept comma or newline separated input, trim spaces, drop empties.
          mapfile -t images < <(
            printf '%s\n' "$DOCKER_IMAGES" \
              | tr ',' '\n' \
              | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//' \
              | grep -v '^$' || true
          )

          if [ "${#images[@]}" -eq 0 ]; then
            echo "::error::No image name found in the docker_images input."
            exit 1
          fi

          echo "Platform: ${PLATFORM} (${ARCH}), ${#images[@]} image(s)"
          printf '  - %s\n' "${images[@]}"

          for image in "${images[@]}"; do
            echo "::group::Pull and save ${image}"

            if ! docker pull --platform "${PLATFORM}" "${image}"; then
              echo "::error::Pull failed: ${image} - check that the tag exists and ships a ${PLATFORM} variant."
              exit 1
            fi

            safe_name="${image//\//_}"
            safe_name="${safe_name//:/_}"
            safe_name="${safe_name//@/_}"
            archive="${safe_name}-${ARCH}.tar.gz"

            # Stream save into gzip so no intermediate tar doubles disk usage.
            if ! docker save "${image}" | gzip -c > "${archive}"; then
              echo "::error::Save failed: ${image} - usually the runner ran out of disk."
              df -h /
              exit 1
            fi
            ls -lh "${archive}"

            echo "::endgroup::"
          done

      - name: Write run summary
        run: |
          set -euo pipefail
          {
            echo "## Result (${ARCH} / ${PLATFORM})"
            echo ""
            echo "| File | Size |"
            echo "| --- | --- |"
            for f in *.tar.gz; do
              [ -e "$f" ] || continue
              echo "| \`$f\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo 'Import with: `docker load -i <file>`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-images-${{ env.ARCH }}
          path: ${{ github.workspace }}/*.tar.gz
          retention-days: ${{ inputs.retention_days || '1' }}
          if-no-files-found: error
